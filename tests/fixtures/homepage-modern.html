<!doctype html>
<html class="user-logged-in dark-mode">
  <head>
    <meta property="og:url" content="https://www.chess.com/home">
    <title>Home - Chess.com</title>
  </head>
  <body>
    <nav id="navigation-sidebar">Main navigation</nav>
    <div class="base-container">
      <header id="mobile-toolbar"></header>

      <main class="layout-component home-layout">
        <div class="layout-hero">
          <section id="home-header" data-fixture-module="native-actions">
            <div class="header-component header-top-padding">
              <section class="cc-section cc-section-content-slim">
                <div class="header-play-header-grid">
                  <div class="play-online-quick-links-component">
                    <div class="play-online-quick-links-buttons">
                      <a
                        href="https://www.chess.com/play/online/new?action=createLiveChallenge&amp;base=600&amp;timeIncrement=0&amp;rated=rated&amp;source=home"
                      >Play 10 min</a>
                      <a href="https://www.chess.com/play/online">New Game</a>
                      <a href="https://www.chess.com/play/coach">Play Coach</a>
                      <a href="https://www.chess.com/play/online/friend">Play a Friend</a>
                    </div>
                  </div>
                  <a
                    class="recommended-activity-component"
                    href="https://www.chess.com/puzzles/rated"
                  >Puzzles</a>
                  <a
                    class="recommended-activity-component"
                    href="https://www.chess.com/lessons/example"
                  >Next Lesson</a>
                  <a
                    class="recommended-activity-component"
                    href="https://www.chess.com/play/computer/example-bot"
                  >Play Bots</a>
                </div>
              </section>
            </div>
          </section>
        </div>

        <div id="home-main" class="layout-column-one">
          <div class="main-component">
            <div
              class="cc-section main-section"
              data-fixture-module="recommended-match"
            >
              <div class="cc-aside-header-component">
                <div class="cc-aside-header-name">
                  <span>Recommended Match</span>
                  <span>1</span>
                </div>
                <button class="play-online-toggle" type="button">Toggle View</button>
              </div>
              <div class="play-online-section-body">
                <div class="play-online-wrapper">
                  <div class="challenge-tile-component">
                    <div class="challenge-tile-board"></div>
                    <div class="challenge-tile-content">
                      <div class="challenge-tile-info-recommended">
                        Recommended opponent
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="cc-section main-section" data-fixture-module="main-placeholder"></div>
            <div
              class="game-history-games-component cc-section cc-overflow-hidden main-section"
              data-fixture-module="game-history"
            >
              <div class="cc-aside-header-component">
                <div class="cc-aside-header-name">Game History</div>
              </div>
              <a href="https://www.chess.com/analysis/game/live/example-game">
                Previous game
              </a>
              <a href="https://www.chess.com/games/archive/sample-player">
                View all games
              </a>
            </div>
          </div>
        </div>

        <div id="home-sidebar" class="layout-column-two">
          <div class="sidebar-component">
            <section class="cc-section sidebar-section" data-fixture-module="daily-puzzle">
              <div class="daily-puzzle-content">
                <div class="daily-puzzle-wrap">Daily Puzzle</div>
              </div>
            </section>

            <div class="badges-component sidebar-section" data-fixture-module="badges">
              <div class="streak-badge-sidebar-wrapper" data-fixture-module="streaks">
                <div class="streak-badge-sidebar-component">Streaks</div>
              </div>
              <div class="badges-divider"></div>
              <a
                class="badge-component"
                data-fixture-module="legend-league"
                href="https://www.chess.com/leagues/legend/example"
              >Legend League</a>
            </div>

            <div class="cc-section sidebar-section" data-fixture-module="friends">
              <a href="https://www.chess.com/friends">Friends</a>
            </div>

            <div class="cc-section sidebar-section" data-fixture-module="chess-tv">
              <button class="tv-player-sidebar-close-button" type="button"></button>
              <div class="tv-player-component"></div>
            </div>

            <div
              class="cc-section cc-overflow-hidden sidebar-section"
              data-fixture-module="stats"
            >
              <a href="https://www.chess.com/stats/sample-player">Stats</a>

              <div class="cc-aside-item-component" data-stats-summary="lessons">
                <span class="cc-aside-item-label">Lessons</span>
              </div>
              <div class="cc-aside-item-component" data-stats-summary="games">
                <span class="cc-aside-item-label">Games</span>
              </div>
              <div class="cc-aside-item-component" data-stats-summary="puzzles">
                <span class="cc-aside-item-label">Puzzles</span>
              </div>

              <div class="stats-divider"></div>

              <div class="stat-item-stats-section" data-stats-rating="bullet">
                <a
                  class="cc-aside-item-component"
                  href="https://www.chess.com/member/sample-player/stats/bullet"
                >
                  <span class="cc-aside-item-label">Bullet</span>
                  <span class="cc-aside-item-chevron">
                    <svg data-glyph="arrow-chevron-bottom"></svg>
                  </span>
                </a>
              </div>
              <div class="stat-item-stats-section" data-stats-rating="daily">
                <a
                  class="cc-aside-item-component"
                  href="https://www.chess.com/member/sample-player/stats/daily"
                >
                  <span class="cc-aside-item-label">Daily</span>
                  <span class="cc-aside-item-chevron">
                    <svg data-glyph="arrow-chevron-bottom"></svg>
                  </span>
                </a>
              </div>
              <div class="stat-item-stats-section" data-stats-rating="rapid">
                <a
                  class="cc-aside-item-component"
                  href="https://www.chess.com/member/sample-player/stats/rapid"
                >
                  <span class="cc-aside-item-label">Rapid</span>
                  <span class="cc-aside-item-chevron">
                    <svg data-glyph="arrow-chevron-bottom"></svg>
                  </span>
                </a>
              </div>
              <div class="stat-item-stats-section" data-stats-rating="blitz">
                <a
                  class="cc-aside-item-component"
                  href="https://www.chess.com/member/sample-player/stats/blitz"
                >
                  <span class="cc-aside-item-label">Blitz</span>
                  <span class="cc-aside-item-chevron">
                    <svg data-glyph="arrow-chevron-bottom"></svg>
                  </span>
                </a>
              </div>

              <div class="stats-divider"></div>

              <div class="stat-item-stats-section" data-stats-rating="puzzles">
                <a
                  class="cc-aside-item-component"
                  href="https://www.chess.com/member/sample-player/stats/puzzles"
                >
                  <span class="cc-aside-item-label">Puzzles</span>
                  <span class="cc-aside-item-chevron">
                    <svg data-glyph="arrow-chevron-bottom"></svg>
                  </span>
                </a>
              </div>
            </div>

            <div class="cc-section sidebar-section" data-fixture-module="unknown-card">
              Future native card
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
