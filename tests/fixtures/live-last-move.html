<!-- Sanitized native live main-line structure from the 2026-09-18 desktop capture.
     Figurine attribute contract also checked against native board code 1.187.1. -->
<wc-simple-move-list board-id="board-single"><div class="timestamps-with-base-time">
  <div class="main-line-row move-list-row" data-whole-move-number="1">
    <div class="node white-move main-line-ply selected" data-node="0-0"><span class="node-highlight-content">Nf3 </span></div>
    <div class="node black-move main-line-ply" data-node="0-1"><span class="node-highlight-content">e6 </span></div>
    <div data-move-list-el="timestamp">4.3s</div>
  </div>
  <div class="main-line-row move-list-row" data-whole-move-number="2">
    <div class="node white-move main-line-ply" data-node="0-2"><span class="node-highlight-content"><span data-figurine="N"></span>c3 </span></div>
    <div class="node black-move main-line-ply" data-node="0-3"><span class="node-highlight-content">dxc7+ </span></div>
    <div class="variation"><div class="node white-move" data-node="1-9">Qh8#</div></div>
  </div>
</div></wc-simple-move-list>
