<!doctype html>
<html class="user-logged-in dark-mode" lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player One vs. Player Two | Game Review fixture</title>
    <style>
      :root {
        color-scheme: dark;
        font-size: 62.5%;
        --gutterSmall: 1rem;
        --layoutPlayerWidth: min(31rem, 100vw - 2.8rem);
      }
      * { box-sizing: border-box; }
      body {
        background: #302e2b;
        color: #e8e8e8;
        font: 1.4rem/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
      }
      .fixture-nav {
        align-items: center;
        display: flex;
        font-size: 2rem;
        font-weight: 700;
        height: 4.8rem;
        padding: 0 1.4rem;
      }
      .board-layout-main {
        display: flex;
        flex-direction: column;
        margin: 0 auto;
        position: relative;
        width: min-content;
      }
      .board-layout-player {
        align-items: center;
        display: flex;
        height: 4rem;
        justify-content: space-between;
        margin: 0 auto;
        width: var(--layoutPlayerWidth);
      }
      .fixture-clock {
        background: #464541;
        border-radius: .3rem;
        font-size: 2.4rem;
        padding: .3rem 1rem;
      }
      .board-layout-chessboard {
        background:
          conic-gradient(from 90deg, #b58863 25%, #f0d9b5 0 50%, #b58863 0 75%, #f0d9b5 0)
          0 0 / 8rem 8rem;
        height: min(34.8rem, 100vw);
        width: min(34.8rem, 100vw);
      }
      .board-layout-analysis {
        height: 0;
        overflow: hidden;
      }
      .board-layout-sidebar {
        background: #262522;
        margin: 1.6rem auto 0;
        width: min(34.8rem, 100vw);
      }
      .sidebar-header-header,
      .game-controls-view-component {
        align-items: center;
        display: flex;
        font-size: 1.8rem;
        font-weight: 700;
        height: 5rem;
        justify-content: space-around;
      }
      .move-by-move-move-list-container { padding: .8rem 1.6rem; }
      .fixture-move {
        display: grid;
        grid-template-columns: 3rem 1fr 1fr;
        padding: .7rem 0;
      }
      .move-by-move-bottom-section { padding: 1.2rem; }
      .game-arc-component { width: 100%; }
      .game-arc-chart {
        background: #3a3936;
        border-radius: .5rem;
        height: 8rem;
        overflow: hidden;
        width: 100%;
      }
      .game-arc-chart svg { display: block; height: 100%; width: 100%; }
      .move-by-move-skills-row-anchor {
        border-top: .1rem solid #464541;
        margin-top: 1.2rem;
        padding: 1.4rem 0;
      }
      @media (min-width: 960px) {
        body {
          display: grid;
          gap: 1.6rem;
          grid-template-columns: min-content 46rem;
          justify-content: center;
          padding: 1.6rem;
          --layoutPlayerWidth: 52.8rem;
        }
        .fixture-nav { display: none; }
        .board-layout-chessboard { height: 52.8rem; width: 52.8rem; }
        .board-layout-sidebar { margin: 0; width: 46rem; }
      }
      button { background:#45433f;color:#eee;border:0;border-radius:6px;cursor:pointer; }
      button svg { width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2; }
      .mobile-gr-footer-footer { align-items:center;background:#262522;bottom:0;display:flex;gap:12px;padding:4px 12px calc(4px + env(safe-area-inset-bottom));position:fixed;left:0;width:100%;z-index:15; }
      .mobile-gr-footer-group-start,.mobile-gr-footer-group-end { align-items:center;display:flex;flex:1 1 0;gap:4px;min-width:0; }
      .mobile-gr-footer-group-end { justify-content:flex-end; }
      .mobile-gr-footer-footer button { width:40px;height:40px;font-size:24px; }
      .fixture-coach { padding:12px;text-align:center; }
      .board-layout-chessboard { position:relative; width:min(34.8rem, calc(100vw - 4rem)); height:min(34.8rem, calc(100vw - 4rem)); }
      @media (min-width:960px) { .board-layout-chessboard { width:52.8rem; height:52.8rem; } }
      .evaluation-bar-bar { position:absolute;left:-18px;top:0;width:14px;height:100%; }
      .evaluation-bar-fill { position:relative;height:100%;width:100%;overflow:hidden;z-index:-1; }
      .evaluation-bar-color { position:absolute;bottom:0;height:100%;width:100%; }
      .evaluation-bar-black { background:#403d39;z-index:1; }
      .evaluation-bar-white { background:#fff;z-index:2; }
      .evaluation-bar-scoreAbbreviated { position:absolute;bottom:4px;color:#403d39;z-index:2;font-size:10px; }
      .sidebar-header-header { --cc-header-button-width:36px;display:flex;justify-content:normal; }
      .cc-sidebar-header-header-start { display:flex; }
      .sidebar-header-header button { display:flex;align-items:center;justify-content:center;flex-shrink:0;width:var(--cc-header-button-width);padding:0;background:transparent; }
      .cc-sidebar-header-header-center { display:flex;align-items:center;justify-content:center;gap:8px;min-width:calc(100% - var(--cc-header-button-width)*4);margin-left:auto; }
      .cc-sidebar-header-title { font-size:17px;white-space:nowrap; }

      .mobile-gr-footer-primary,.flow-buttons-component .cc-button-primary {background:#81b64c;color:white}
      .game-arc-chart svg {width:100%;height:100%}
      wc-chess-board { display:block;position:relative;width:100%;height:100%; }
      .piece {position:absolute;width:12.5%;height:12.5%;background-size:cover;}
      .board-layout-player > div {width:100%}
      .player-component {display:flex;gap:8px;align-items:center;width:100%}
      .player-tagline {flex:1}.player-avatar{font-size:30px}
      .move-time-time {background:#45433f;padding:3px 10px;font-size:24px;display:flex}
      .mobile-top-section-container {height:140px;padding:12px}
      .bot-speech-avatar-and-wrapper-avatarAndWrapper {display:flex}
      .bot-speech-avatar-and-wrapper-bot{width:50px;font-size:40px}
      .move-feedback-wrapper {flex:1;min-width:0;min-height:100px}
      .bot-speech-content-botMessage {background:white;color:#333;border-radius:12px;min-height:100px}
      .bot-speech-content-content-container {padding:12px;min-height:100px;max-height:130px;overflow:auto}
      .move-feedback-box-content{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:6px}
      .bot-speech-content-tip{position:absolute;left:-10px;color:white}
      .move-by-move-coach-section {display:none}
      @media(min-width:600px){
        body {display:grid;grid-template-columns:min-content minmax(280px,460px);gap:16px;justify-content:center;padding:16px;--layoutPlayerWidth:min(44vw,528px)}
        .fixture-nav,.mobile-top-section-container,.mobile-gr-footer-footer {display:none}
        .board-layout-chessboard {width:var(--layoutPlayerWidth);height:var(--layoutPlayerWidth)}
        .board-layout-sidebar {width:min(42vw,460px);margin:0}
        .move-by-move-coach-section {display:flex;flex-direction:column;min-height:180px}
        .flow-buttons-component,.review-desktop-navigation{display:flex;gap:8px;padding:8px;justify-content:space-between}
        .flow-buttons-component button,.review-desktop-navigation button{min-height:44px;min-width:44px}
        .review-desktop-navigation button{font-size:28px}
      }
    </style>
  </head>
